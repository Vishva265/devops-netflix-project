name: CI/CD Docker Build & Push

on:
  push:
    branches:
      - main

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # FRONTEND IMAGE
      - name: Build Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netflixclone-frontend:latest ./client

      # BACKEND IMAGE
      - name: Build Backend Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/netflixclone-backend:latest ./server

      # LOGIN TO DOCKER HUB
      - name: Docker Hub Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # PUSH FRONTEND
      - name: Push Frontend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/netflixclone-frontend:latest

      # PUSH BACKEND
      - name: Push Backend Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/netflixclone-backend:latest